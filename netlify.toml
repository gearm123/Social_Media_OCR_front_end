# https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Canonical origin: sitemap.xml <loc>, robots.txt Sitemap line, OG URL, canonical (seo.ts).
  # Must match the domain you use in Google Search Console, or GSC shows "URL not allowed" on <loc> entries.
  # Netlify UI env vars override this file — remove or update VITE_SITE_URL there if it still points at *.netlify.app.
  VITE_SITE_URL = "https://chatreconstruct.com"
  # Required for Vite: baked in at `npm run build`. Change this if your API host differs.
  # You can override with Netlify → Site configuration → Environment variables (same name), then redeploy.
  VITE_API_BASE_URL = "https://translate-chat-backend.onrender.com"

# Paddle overlay checkout on /pay requires VITE_PADDLE_CLIENT_TOKEN (set in Netlify env + redeploy).
# On Render, set API CORS_ORIGINS (or FRONTEND_URL) to this site’s exact origin(s), e.g.
# https://chatreconstruct.com and https://www.chatreconstruct.com — or the browser shows “Failed to fetch”.
# FRONTEND_URL on the API should match your primary checkout return URL / Paddle-approved domain.

# ---------------------------------------------------------------------------
# Redirects (order matters). public/_redirects is processed first (host rules only);
# these rules run next — repeat HTTP/www→apex so they still apply if _redirects is skipped.
# Netlify UI: Domains → HTTPS → Enforce HTTPS (recommended). index.html has a small JS backup.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "http://chatreconstruct.com/*"
  to = "https://chatreconstruct.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.chatreconstruct.com/*"
  to = "https://chatreconstruct.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.chatreconstruct.com/*"
  to = "https://chatreconstruct.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ai-chat-screenshot-translator"
  to = "/uses"
  status = 301

[[redirects]]
  from = "/ai-translate-chat-screenshots"
  to = "/uses"
  status = 301

[[redirects]]
  from = "/translate-chat-screenshots-with-ai"
  to = "/uses"
  status = 301

[[redirects]]
  from = "/chat-screenshot-ai-translation"
  to = "/uses"
  status = 301

[[redirects]]
  from = "/ai-conversation-screenshot-translator"
  to = "/uses"
  status = 301

[[redirects]]
  from = "/translate-chat-ui-screenshots-ai"
  to = "/uses"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
